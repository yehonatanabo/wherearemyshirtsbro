<title>מה עם החולצות שלי אח?</title>
<style>
:root{--bg:#fdf6f0;--card:#fff;--ink:#4a4458;--mut:#948da3;--a:#cdb8f5;--b:#ffd6c9;--c:#c6efdc;--line:#eee6f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#272433;--card:#332f42;--ink:#efeaf7;--mut:#a59fb5;--a:#6f5ba3;--b:#8a5f58;--c:#4c7a66;--line:#443f57}}
:root[data-theme="dark"]{--bg:#272433;--card:#332f42;--ink:#efeaf7;--mut:#a59fb5;--a:#6f5ba3;--b:#8a5f58;--c:#4c7a66;--line:#443f57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.7rem;line-height:1.2;text-align:center;margin:8px 0 22px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 24px rgba(150,120,200,.14);margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 6px}
input,select,button{font:inherit;color:inherit;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:11px 13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--a)}
button{background:var(--a);border:0;font-weight:600;cursor:pointer;margin-top:16px}
button.sm{width:auto;padding:8px 12px;margin:0;background:var(--b)}
.big{font-size:3.4rem;text-align:center}.c{text-align:center}
.shirt{display:flex;justify-content:space-between;background:var(--c);border-radius:14px;padding:10px 14px;margin:8px 0}
.step{position:relative;padding:0 0 16px 0;padding-inline-start:22px;border-inline-start:3px solid var(--a);margin-inline-start:6px}
.step:before{content:"";position:absolute;inset-inline-start:-9px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--b);border:3px solid var(--card)}
.step small{color:var(--mut);display:block}
.row{display:flex;gap:8px;margin:8px 0}.row input:first-child{flex:0 0 36%}
.adm{text-align:center;margin-top:24px}.adm button{width:auto;background:transparent;color:var(--mut);font-size:.8rem}
</style></head><body><main><div id="app" dir="ltr"></div></main>

<script>
const S=JSON.parse(document.getElementById('state').textContent),$=id=>document.getElementById(id),app=$('app');
const norm=s=>s.normalize('NFC').replace(/[\s"'׳״.\-־()\[\],\u200e\u200f\u202a-\u202e]/g,'').toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function steps(d){const t=S.tl[S.divs[d]]||[];return t.map(x=>`<div class="step"><b dir="auto">${esc(x.t)}</b>${x.d?`<small>${esc(x.d)}</small>`:''}</div>`).join('')||'<p class="c">אין עדכונים עדיין.</p>'}
function home(msg){app.dir='rtl';app.innerHTML=`<h1>מה עם החולצות<br>שלי אח? 👕</h1><div class="card"><label>שמך בישראל (כפי שמופיע בפורמס)</label><input id="n" dir="auto" autocomplete="off"><label>מסגרת</label><select id="d">${S.divs.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('')}</select><button id="go">יאללה חפש לי ת׳חולצה!</button></div>${msg||''}<div class="adm" id="adm"></div>`;
$('go').onclick=find;$('n').onkeydown=e=>{if(e.key==='Enter')find()};adminHook()}
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(n,d){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(n)+'|'+d),'PBKDF2',false,['deriveBits']);
const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(S.salt),iterations:150000,hash:'SHA-256'},km,512));
return{id:hex(bits.slice(0,32)),raw:bits.slice(32)}}
async function find(){const n=$('n').value,d=+$('d').value;if(!norm(n))return;const btn=$('go');btn.disabled=true;
try{const k=await derive(n,S.divs[d]),r=S.e.find(x=>x.i===k.id);
if(r){const key=await crypto.subtle.importKey('raw',k.raw,'AES-GCM',false,['decrypt']);
const p=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(r.v)},key,b64d(r.c))));
if(!p[1])return res(`<div class="card c"><div class="big">😢</div><p><b>קיבלתי את ההזמנה, אבל לא שילמת עליה. נתראה בסבב הבא!</b></p></div>`);
return res((p[3]?`<div class="card c"><p dir="auto"><b>${esc(p[3])}</b></p></div>`:'')+`<div class="card"><h3 style="margin-top:0" dir="auto">${esc(p[0])}</h3>${p[2].map((s,i)=>`<div class="shirt"><span>חולצה ${i+1}</span><b>${esc(s)}</b></div>`).join('')}</div><div class="card"><h3 style="margin-top:0">הנה מה קורה עם ההזמנה</h3>${steps(d)}</div>`)}
}catch(e){}
res(`<div class="card c"><div class="big">🤔</div><p>לא מצאתי את ההזמנה שלך. שימו לב שאתם מכניסים את אותו השם שכתבתם בפורמס.</p></div>`)}
function res(h){home(h);}
async function adminHook(){try{const u=await claude.use('user');if(u&&u.isOwner()){$('adm').innerHTML='<button id="ab">admin</button>';$('ab').onclick=admin}}catch(e){}}
const FAM='משפחה/חברים',MSG='משפחה וחברים יקרים, אני דואג לחולצות שלכם באופן אישי. ברגע שהן יגיעו נשלח אותם לבית של חיים וטניה!';
const b64e=u=>btoa(String.fromCharCode(...u));
async function publishState(){const a=await claude.use('artifact');const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');await a.publish('<!doctype html>'+c.outerHTML)}
function admin(){let di=0,rows=[];const key=()=>S.divs[di];const load=()=>{rows=JSON.parse(JSON.stringify(S.tl[key()]||[]))};load();
const draw=()=>{app.dir='ltr';app.innerHTML=`<h1>admin</h1><div class="card"><h3 style="margin-top:0">timeline</h3><label>division</label><select id="ad">${S.divs.map((x,i)=>`<option value="${i}" ${i===di?'selected':''}>${esc(x)}</option>`).join('')}</select>${rows.map((r,i)=>`<div class="row"><input data-i="${i}" data-k="d" value="${esc(r.d)}" placeholder="date"><input data-i="${i}" data-k="t" dir="auto" value="${esc(r.t)}" placeholder="description"><button class="sm" data-x="${i}">✕</button></div>`).join('')}<button class="sm" id="add" style="margin-top:12px">+ step</button><label><input type="checkbox" id="all" style="width:auto"> apply to all divisions</label><button id="save">save &amp; publish</button><p class="c" id="st"></p></div>
<div class="card"><h3 style="margin-top:0">update database</h3><p style="color:var(--mut);margin:0 0 8px">Upload the latest Excel responses file (.xlsx). Timelines are kept.</p><input type="file" id="f" accept=".xlsx,.xls"><button id="prev">read file</button><div id="up" style="margin-top:12px"></div></div><button id="back" style="background:var(--b)">back</button>`;
$('ad').onchange=e=>{di=+e.target.value;load();draw()};
app.querySelectorAll('input[data-k]').forEach(el=>el.oninput=()=>{rows[el.dataset.i][el.dataset.k]=el.value});
app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.x,1);draw()});
$('add').onclick=()=>{rows.push({d:'',t:''});draw()};$('back').onclick=()=>home();
$('save').onclick=async()=>{const clean=rows.filter(r=>r.t.trim()||r.d.trim());if($('all').checked)S.divs.forEach(x=>S.tl[x]=JSON.parse(JSON.stringify(clean)));else S.tl[key()]=clean;
$('st').textContent='publishing...';try{await publishState();$('st').textContent='published ✓'}catch(e){$('st').textContent='could not publish: '+(e.code||e.message)}};
$('prev').onclick=readFile};draw()}
async function readFile(){const f=$('f').files[0],up=$('up');if(!f){up.textContent='choose a file first';return}
try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const rx=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
const people=new Map(),divs=[];
rx.slice(1).forEach(r=>{const nm=r[1]==null?'':String(r[1]).trim(),dv=r[2]==null?'':String(r[2]).trim();if(!nm||!dv)return;if(!divs.includes(dv))divs.push(dv);
const sizes=[r[3],r[4],r[5]].filter(x=>x!=null&&String(x).trim()!=='').map(x=>String(x).trim());
const paid=r[6]===true||String(r[6]).toUpperCase()==='TRUE'||dv===FAM,sp=r[7]!=null&&String(r[7]).includes('ללא תשלום');
const k=norm(nm)+'|'+dv;let e=people.get(k);if(!e){e={n:nm,dv,paid:false,sizes:[],sp:false};people.set(k,e)}
e.paid=e.paid||paid;e.sizes.push(...sizes);e.sp=e.sp||sp});
if(!people.size){up.textContent='no rows recognized — is this the right file?';return}
const list=[...people.values()],paidN=list.filter(e=>e.paid).length,newd=divs.filter(x=>!S.divs.includes(x)),gone=S.divs.filter(x=>!divs.includes(x));
up.innerHTML=`<p>${list.length} people · ${paidN} paid · ${list.length-paidN} unpaid · ${divs.length} divisions${newd.length?'<br>new divisions: '+esc(newd.join(', ')):''}${gone.length?'<br>not in file anymore: '+esc(gone.join(', ')):''}</p><button id="pub">publish update</button><p class="c" id="ps"></p>`;
$('pub').onclick=async()=>{$('pub').disabled=true;const enc=[];let n=0;
try{for(let i=0;i<list.length;i+=8)await Promise.all(list.slice(i,i+8).map(async e=>{const k=await derive(e.n,e.dv),key=await crypto.subtle.importKey('raw',k.raw,'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify([e.n,e.paid?1:0,e.sizes,e.sp?MSG:'']))));enc.push({i:k.id,v:b64e(iv),c:b64e(ct)});$('ps').textContent='encrypting '+(++n)+' / '+list.length}));
enc.sort((a,b)=>a.i<b.i?-1:1);S.e=enc;S.divs=divs;divs.forEach(x=>{S.tl[x]=S.tl[x]||[]});
$('ps').textContent='publishing...';await publishState();$('ps').textContent='published ✓ — reload the page'}catch(e){$('ps').textContent='failed: '+(e.code||e.message);$('pub').disabled=false}}
}catch(e){up.textContent='could not read file: '+e.message}}

home();
</script>
</body></html>
